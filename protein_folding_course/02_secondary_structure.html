<script>
"use strict";
/* ============ 向量工具 ============ */
const V={
  sub:(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}),
  add:(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z}),
  scale:(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s}),
  dot:(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,
  cross:(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}),
  norm:a=>{const l=Math.hypot(a.x,a.y,a.z)||1;return{x:a.x/l,y:a.y/l,z:a.z/l};},
  dist:(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z),
  len:a=>Math.hypot(a.x,a.y,a.z)
};
const D2R=Math.PI/180;

/* NeRF：已知 A-B-C，按 键长/键角/二面角(A-B-C-D) 放置 D，使二面角严格等于给定值 */
function nerf(A,B,C,len,angDeg,dihDeg){
  const ang=angDeg*D2R,dih=dihDeg*D2R;
  const bc=V.norm(V.sub(C,B));
  const n =V.norm(V.cross(V.sub(B,A),bc));
  const m =V.cross(n,bc);
  const d={x:-len*Math.cos(ang),y:len*Math.sin(ang)*Math.cos(dih),z:len*Math.sin(ang)*Math.sin(dih)};
  return V.add(C,V.add(V.scale(bc,d.x),V.add(V.scale(m,d.y),V.scale(n,d.z))));
}
/* sp2 平面：羰基 C=O、酰胺 N-H 都落在肽平面内 */
function sp2third(X,P,Q,len){
  const u=V.norm(V.sub(P,X)),v=V.norm(V.sub(Q,X));
  return V.add(X,V.scale(V.norm(V.scale(V.add(u,v),-1)),len));
}
/* sp3 四面体：从 Cα 伸出的 Cβ（L 型构型，相对 N、C、H 正确朝向） */
function sp3CB(X,P,Q,len){
  const u=V.norm(V.sub(P,X)),v=V.norm(V.sub(Q,X));
  const bis=V.norm(V.add(u,v)),perp=V.norm(V.cross(u,v));
  const c=Math.cos(54.75*D2R),s=Math.sin(54.75*D2R);
  const dir=V.norm(V.add(V.scale(bis,-c),V.scale(perp,s)));
  return V.add(X,V.scale(dir,len));
}

/* ============ 固定主链几何（与 02_omega_phi_psi.html 一致）============ */
const BL={NCA:1.46,CAC:1.52,CN:1.33,CO:1.23,NH:1.00,CACB:1.52};
const BA={NCAC:111,CACN:116,CNCA:122};

/* 给定每残基 (phi,psi,omega) 构建一条主链；返回残基数组（每个含 N,CA,C,O,H,CB）*/
function buildChain(specs){
  const res=[];
  let N={x:0,y:0,z:0}, CA={x:BL.NCA,y:0,z:0};
  const a=(180-BA.NCAC)*D2R;
  let C={x:BL.NCA+BL.CAC*Math.cos(a),y:BL.CAC*Math.sin(a),z:0};
  res.push({N,CA,C});
  for(let i=1;i<specs.length;i++){
    const p=res[i-1];
    const Nn =nerf(p.N,p.CA,p.C,BL.CN, BA.CACN, specs[i-1].psi);
    const CAn=nerf(p.CA,p.C,Nn, BL.NCA,BA.CNCA, specs[i-1].omega);
    const Cn =nerf(p.C,Nn,CAn, BL.CAC,BA.NCAC, specs[i].phi);
    res.push({N:Nn,CA:CAn,C:Cn});
  }
  for(let i=0;i<res.length;i++){
    const r=res[i];
    const nextN=i+1<res.length?res[i+1].N:V.add(r.C,V.sub(r.C,r.CA));
    r.O=sp2third(r.C,r.CA,nextN,BL.CO);
    if(i>0){r.H=sp2third(r.N,res[i-1].C,r.CA,BL.NH);} else {r.H=null;}
    r.CB=sp3CB(r.CA,r.N,r.C,BL.CACB);
  }
  return res;
}
function xf(res,fn){
  return res.map(r=>{const o={};for(const k of['N','CA','C','O','H','CB'])o[k]=r[k]?fn(r[k]):null;return o;});
}
/* 把单条 β 链对齐到规范坐标系：轴->x，便于按对称性平铺出折叠片 */
function alignStrand(res){
  const n=res.length;
  const u=V.norm(V.sub(res[n-1].CA,res[0].CA));
  let nrm={x:0,y:0,z:0};
  for(let i=1;i<n-1;i++) nrm=V.add(nrm,V.cross(V.sub(res[i+1].CA,res[i].CA),V.sub(res[i-1].CA,res[i].CA)));
  nrm=V.norm(nrm);
  const w=V.norm(V.cross(nrm,u)), nn=V.norm(V.cross(u,w));
  const c=res[Math.floor(n/2)].CA;
  return xf(res,p=>{const q=V.sub(p,c);return{x:V.dot(q,u),y:V.dot(q,nn),z:V.dot(q,w)};});
}

/* ============ 三种二级结构（角度与平铺参数均经几何验证）============ */
function buildStructure(mode,len,cnt){
  let strands=[]; // 每条链一个残基数组
  if(mode==='helix'){
    strands=[ buildChain(Array.from({length:len},()=>({phi:-57,psi:-47,omega:180}))) ];
  } else if(mode==='anti'){
    const ref=alignStrand(buildChain(Array.from({length:7},()=>({phi:-139,psi:135,omega:180}))));
    const S=-4.4, dxReg=-0.6;
    for(let k=0;k<cnt;k++){
      if(k%2===0) strands.push(xf(ref,p=>({x:p.x, y:p.y+S*k, z:p.z})));
      else strands.push(xf(ref,p=>({x:-p.x+dxReg, y:-p.y+S*k, z:p.z}))); // 绕 z 反向 + 平移
    }
  } else { // para
    const ref=alignStrand(buildChain(Array.from({length:7},()=>({phi:-119,psi:113,omega:180}))));
    const P=-4.6;
    for(let k=0;k<cnt;k++) strands.push(xf(ref,p=>({x:p.x, y:p.y+P*k, z:p.z})));
  }

  /* 汇总原子，做扁平索引 */
  const atoms=[]; const traces=[];
  strands.forEach((res,si)=>{
    const trace=[];
    res.forEach((r,ri)=>{
      const add=(el,key,label)=>{ if(r[key]) atoms.push({el,label,pos:{...r[key]},strand:si,res:ri,key}); };
      add('N','N','N'); add('C','CA','Cα'); add('C','C','C');
      add('O','O','O'); add('H','H','H'); add('CB','CB','Cβ');
      trace.push({...r.CA});
    });
    traces.push(trace);
  });

  /* 居中 */
  const ctr={x:0,y:0,z:0}; atoms.forEach(a=>{ctr.x+=a.pos.x;ctr.y+=a.pos.y;ctr.z+=a.pos.z;});
  ctr.x/=atoms.length; ctr.y/=atoms.length; ctr.z/=atoms.length;
  atoms.forEach(a=>a.pos=V.sub(a.pos,ctr));
  traces.forEach(t=>t.forEach((p,i)=>t[i]=V.sub(p,ctr)));

  /* 主链键（按链内顺序）*/
  const bonds=[];
  // 重建每残基的 4 个关键原子的全局索引，方便连键
  const idx={}; // `${strand}_${res}_${key}` -> atom index
  atoms.forEach((a,i)=>idx[`${a.strand}_${a.res}_${a.key}`]=i);
  strands.forEach((res,si)=>{
    for(let ri=0;ri<res.length;ri++){
      const g=(k)=>idx[`${si}_${ri}_${k}`];
      const gn=(k)=>idx[`${si}_${ri+1}_${k}`];
      if(g('N')!=null&&g('CA')!=null) bonds.push({a:g('N'),b:g('CA')});
      if(g('CA')!=null&&g('C')!=null) bonds.push({a:g('CA'),b:g('C')});
      if(g('C')!=null&&gn('N')!=null) bonds.push({a:g('C'),b:gn('N'),pep:true});
      if(g('C')!=null&&g('O')!=null) bonds.push({a:g('C'),b:g('O'),dbl:true});
      if(g('N')!=null&&g('H')!=null) bonds.push({a:g('N'),b:g('H'),h:true});
      if(g('CA')!=null&&g('CB')!=null) bonds.push({a:g('CA'),b:g('CB'),cb:true});
    }
  });

  /* 氢键检测：羰基 O ··· 酰胺 H < 2.5Å，且非同链近邻 */
  const Os=atoms.map((a,i)=>({a,i})).filter(o=>o.a.key==='O');
  const Hs=atoms.map((a,i)=>({a,i})).filter(o=>o.a.key==='H');
  const hbonds=[];
  for(const o of Os){
    let best=null;
    for(const h of Hs){
      if(o.a.strand===h.a.strand && Math.abs(o.a.res-h.a.res)<=2) continue;
      const d=V.dist(o.a.pos,h.a.pos);
      if(d<2.5 && (!best||d<best.d)) best={h,d};
    }
    if(best) hbonds.push({o:o.i, h:best.h.i, oRes:o.a.res, hRes:best.h.a.res,
                          oStr:o.a.strand, hStr:best.h.a.strand, d:best.d});
  }

  /* 统计量 */
  const stats=computeStats(mode,strands,traces,hbonds,len,cnt);
  return {atoms,bonds,hbonds,traces,stats,mode};
}

function computeStats(mode,strands,traces,hbonds,len,cnt){
  if(mode==='helix'){
    const ca=traces[0];
    // 螺旋轴：相邻 (CA[i]-CA[i-1])×(CA[i+1]-CA[i]) 的平均方向
    let axis={x:0,y:0,z:0};
    for(let i=1;i<ca.length-1;i++) axis=V.add(axis,V.cross(V.sub(ca[i],ca[i-1]),V.sub(ca[i+1],ca[i])));
    axis=V.norm(axis);
    // 质心落在中心轴上，作为投影基点（用 ca[0] 会偏到柱面上，使转角算错一半）
    const cen={x:0,y:0,z:0}; ca.forEach(p=>{cen.x+=p.x;cen.y+=p.y;cen.z+=p.z;});
    cen.x/=ca.length; cen.y/=ca.length; cen.z/=ca.length;
    const proj=p=>{const t=V.dot(V.sub(p,cen),axis); return V.sub(V.sub(p,cen),V.scale(axis,t));};
    // 每残基绕轴转角 & 沿轴上升
    let angs=[],rises=[];
    for(let i=1;i<ca.length;i++) rises.push(Math.abs(V.dot(V.sub(ca[i],ca[i-1]),axis)));
    for(let i=1;i<ca.length-1;i++){
      const v1=V.norm(proj(ca[i])), v2=V.norm(proj(ca[i+1]));
      let c=Math.max(-1,Math.min(1,V.dot(v1,v2)));
      angs.push(Math.acos(c)/D2R);
    }
    const avgAng=angs.reduce((s,x)=>s+x,0)/angs.length;
    const avgRise=rises.reduce((s,x)=>s+x,0)/rises.length;
    return {kind:'helix', rows:[
      ['残基数', len+''],
      ['每圈残基数', (360/avgAng).toFixed(1)+' 残基/圈'],
      ['每残基上升', avgRise.toFixed(2)+' Å'],
      ['每圈螺距', (avgRise*360/avgAng).toFixed(2)+' Å'],
      ['手性', '右手螺旋'],
      ['主链氢键 (i→i+4)', hbonds.length+' 个'],
    ]};
  } else {
    // 链间 Cα 最近距离
    let sp=1e9;
    for(let s=0;s<strands.length-1;s++)
      for(const r1 of strands[s]) for(const r2 of strands[s+1])
        sp=Math.min(sp,V.dist(r1.CA,r2.CA));
    return {kind:'sheet', rows:[
      ['类型', mode==='anti'?'反平行 antiparallel':'平行 parallel'],
      ['β 链数', cnt+' 条'],
      ['每链残基数', '7'],
      ['相邻链 Cα 间距', sp.toFixed(2)+' Å'],
      ['链间主链氢键', hbonds.length+' 个'],
      ['侧链朝向', '相邻残基交替上/下'],
    ]};
  }
}

/* ============ 颜色 / 半径 ============ */
const COL={N:'#4b7bec',C:'#cfd2dc',O:'#eb4d3d',H:'#eef0f3',CB:'#7bd88f'};
const RAD={N:.32,C:.32,O:.30,H:.21,CB:.31};
const PEPCOL='#9aa0b4';

/* ============ 相机 / 投影 ============ */
const canvas=document.getElementById('cv');
const ctx=canvas.getContext('2d');
let W=0,H=0,yaw=-0.6,pitch=0.25,dist=40,focal=620;
let STRUCT=null;
const show={hb:true,ribbon:true,cb:true,arrow:true,label:false,spin:true};

function resize(){
  const r=canvas.getBoundingClientRect(); W=r.width;H=r.height;
  const dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr; canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);

function project(p){
  const cy=Math.cos(yaw),sy=Math.sin(yaw);
  let x1=p.x*cy+p.z*sy, z1=-p.x*sy+p.z*cy, y1=p.y;
  const cx=Math.cos(pitch),sx=Math.sin(pitch);
  let y2=y1*cx-z1*sx, z2=y1*sx+z1*cx, x2=x1;
  const zc=z2+dist, f=focal/zc;
  return {x:W/2+x2*f, y:H/2-y2*f, z:zc, scale:f};
}
function fitView(){
  let R=0; for(const a of STRUCT.atoms) R=Math.max(R,V.len(a.pos));
  dist=R*2.3+12;
}

/* ============ 绘制基元 ============ */
function lighten(hex,t){const c=hex.replace('#','');const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  return `rgb(${Math.round(r+(255-r)*t)},${Math.round(g+(255-g)*t)},${Math.round(b+(255-b)*t)})`;}
function hexA(hex,al){const c=hex.replace('#','');return `rgba(${parseInt(c.substr(0,2),16)},${parseInt(c.substr(2,2),16)},${parseInt(c.substr(4,2),16)},${al})`;}
function seg(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}

function drawSphere(px,py,r,color){
  if(r<0.4)return;
  const g=ctx.createRadialGradient(px-r*0.35,py-r*0.35,r*0.1,px,py,r);
  g.addColorStop(0,lighten(color,0.55)); g.addColorStop(1,color);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,r,0,7); ctx.fill();
  ctx.lineWidth=Math.max(.5,r*0.07); ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.stroke();
}

/* Catmull-Rom 插值，平滑缎带通过 Cα */
function catmull(pts,sub){
  if(pts.length<2)return pts.slice();
  const P=[pts[0],...pts,pts[pts.length-1]], out=[];
  for(let i=1;i<P.length-2;i++){
    const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2];
    for(let s=0;s<sub;s++){
      const t=s/sub,t2=t*t,t3=t2*t;
      out.push({
        x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3),
        z:0.5*((2*p1.z)+(-p0.z+p2.z)*t+(2*p0.z-5*p1.z+4*p2.z-p3.z)*t2+(-p0.z+3*p1.z-3*p2.z+p3.z)*t3),
      });
    }
  }
  out.push(pts[pts.length-1]);
  return out;
}

function label(px,py,text,color){
  ctx.font='600 12px -apple-system,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=3.2; ctx.strokeStyle='rgba(8,10,15,.92)'; ctx.strokeText(text,px,py);
  ctx.fillStyle=color; ctx.fillText(text,px,py);
}

/* ============ 主循环 ============ */
function frame(){
  requestAnimationFrame(frame);
  if(show.spin && !drag){ yaw+=0.0045; }

  const A=STRUCT.atoms;
  const proj=A.map(a=>project(a.pos));
  const prims=[];
  const ribbonCol = STRUCT.mode==='helix' ? '#f5a623' : '#22c7d6';

  /* 缎带（半透明，平滑管）*/
  if(show.ribbon){
    for(const trace of STRUCT.traces){
      const sm=catmull(trace,10);
      const sp=sm.map(project);
      for(let i=0;i<sp.length-1;i++){
        const a=sp[i],b=sp[i+1];
        prims.push({depth:(a.z+b.z)/2, draw:()=>{
          const w=Math.max(2, 0.42*((a.scale+b.scale)/2));
          ctx.lineCap='round';
          ctx.strokeStyle=hexA(ribbonCol,.15); ctx.lineWidth=w*1.9; seg(a.x,a.y,b.x,b.y);
          ctx.strokeStyle=hexA(ribbonCol,.55); ctx.lineWidth=w; seg(a.x,a.y,b.x,b.y);
        }});
      }
      /* β 链 / 螺旋 末端箭头：指向 C 端 */
      if(show.arrow && trace.length>=2){
        const pen=project(trace[trace.length-2]), tip=project(trace[trace.length-1]);
        prims.push({depth:tip.z-0.01, draw:()=>{
          const dx=tip.x-pen.x,dy=tip.y-pen.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
          const s=Math.max(8, 0.95*tip.scale);
          const ex=tip.x+ux*s, ey=tip.y+uy*s;
          ctx.fillStyle=hexA(ribbonCol,.92);
          ctx.beginPath();
          ctx.moveTo(ex,ey);
          ctx.lineTo(tip.x+nx*s*0.7, tip.y+ny*s*0.7);
          ctx.lineTo(tip.x-nx*s*0.7, tip.y-ny*s*0.7);
          ctx.closePath(); ctx.fill();
        }});
      }
    }
  }

  /* 主链键 */
  for(const bd of STRUCT.bonds){
    if(!show.cb && bd.cb) continue;
    const pa=proj[bd.a], pb=proj[bd.b];
    prims.push({depth:(pa.z+pb.z)/2, draw:()=>{
      const w=0.17*((pa.scale+pb.scale)/2);
      ctx.lineCap='round';
      if(bd.pep){ ctx.strokeStyle=PEPCOL; ctx.lineWidth=w*1.25; seg(pa.x,pa.y,pb.x,pb.y); return; }
      const c1=COL[A[bd.a].el], c2=COL[A[bd.b].el];
      const mx=(pa.x+pb.x)/2,my=(pa.y+pb.y)/2;
      if(bd.dbl){
        const dx=pb.x-pa.x,dy=pb.y-pa.y,L=Math.hypot(dx,dy)||1,ox=-dy/L*w*.8,oy=dx/L*w*.8;
        ctx.lineWidth=w*0.62;
        ctx.strokeStyle=c1;seg(pa.x+ox,pa.y+oy,mx+ox,my+oy);ctx.strokeStyle=c2;seg(mx+ox,my+oy,pb.x+ox,pb.y+oy);
        ctx.strokeStyle=c1;seg(pa.x-ox,pa.y-oy,mx-ox,my-oy);ctx.strokeStyle=c2;seg(mx-ox,my-oy,pb.x-ox,pb.y-oy);
      } else {
        ctx.lineWidth=w; ctx.strokeStyle=c1; seg(pa.x,pa.y,mx,my); ctx.strokeStyle=c2; seg(mx,my,pb.x,pb.y);
      }
    }});
  }

  /* 氢键虚线 */
  if(show.hb){
    for(const hb of STRUCT.hbonds){
      const pa=proj[hb.o], pb=proj[hb.h];
      prims.push({depth:(pa.z+pb.z)/2-0.001, draw:()=>{
        ctx.save();
        ctx.setLineDash([3,3.5]); ctx.lineCap='butt';
        ctx.strokeStyle=hexA('#ffd166',.95); ctx.lineWidth=Math.max(1.4,0.17*((pa.scale+pb.scale)/2));
        seg(pa.x,pa.y,pb.x,pb.y);
        ctx.restore();
      }});
    }
  }

  /* 原子 */
  A.forEach((at,i)=>{
    if(!show.cb && at.el==='CB') return;
    const r=(at.label==='Cα'?0.36:RAD[at.el])*proj[i].scale;
    prims.push({depth:proj[i].z, draw:()=>drawSphere(proj[i].x,proj[i].y,r,COL[at.el])});
  });

  prims.sort((p,q)=>q.depth-p.depth);
  ctx.clearRect(0,0,W,H);
  for(const p of prims) p.draw();

  /* 标签（覆盖层）*/
  if(show.label){
    A.forEach((at,i)=>{
      if(!show.cb && at.el==='CB') return;
      if(at.el==='H') return;
      const p=proj[i], off=((at.label==='Cα'?0.36:RAD[at.el])*p.scale)+9;
      label(p.x,p.y-off, at.label, at.el==='CB'?'#7bd88f':'#e7e9f0');
    });
  }
}

/* ============ UI ============ */
let mode='helix', len=18, cnt=3;
function rebuild(){
  STRUCT=buildStructure(mode,len,cnt);
  fitView();
  renderStats(); renderNotes(); renderBadge();
}
function renderStats(){
  const s=STRUCT.stats;
  document.getElementById('stats').innerHTML =
    s.rows.map(r=>`<div class="stat"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
}
function renderBadge(){
  const b=document.getElementById('badge');
  if(mode==='helix') b.innerHTML='<b>α 螺旋</b> · 右手 · 每圈≈3.6 残基 · <span style="color:#ffd166">i→i+4 氢键</span>';
  else if(mode==='anti') b.innerHTML='<b>β 折叠片（反平行）</b> · 相邻链反向 · <span style="color:#ffd166">链间氢键近乎垂直</span>';
  else b.innerHTML='<b>β 折叠片（平行）</b> · 相邻链同向 · <span style="color:#ffd166">链间氢键斜跨</span>';
}
const NOTES={
  helix:`<p><b class="h">α 螺旋</b>把主链盘成<b>右手螺旋</b>，平均每圈约 <b>3.6 个残基</b>、每残基沿轴上升约 <b>1.5 Å</b>。</p>
  <p>它靠一种很规律的<b>主链—主链氢键</b>固定：第 <code>i</code> 残基的羰基 <b>C=O</b> 与第 <code>i+4</code> 残基的酰胺 <b>N–H</b> 成键（黄色虚线，记作 <b class="y">i→i+4</b>）。注意成键的是<b>主链原子</b>，与侧链无关。</p>
  <p>所有侧链 <b style="color:#7bd88f">Cβ</b> 都朝<b>外</b>辐射、不挤进螺旋内部——这正是螺旋能紧密盘绕的原因。</p>
  <p>把"长度"调大，你会看到氢键一根接一根、像拉链一样把整条螺旋扣紧：单根氢键弱，但<b>数量多</b>，累加起来稳稳撑住结构（见 2.5.2）。</p>`,
  anti:`<p><b class="s">β 折叠片（反平行）</b>：几条伸展的 <b>β 链</b>并排，靠<b>链段之间</b>的主链氢键连成"片"。相邻两条链方向<b>相反</b>（看箭头），这让链间氢键几乎<b>垂直</b>于链、最规整也最稳。</p>
  <p>每条链不是直的，而是<b>锯齿状起伏（pleated，"褶"）</b>；侧链 <b style="color:#7bd88f">Cβ</b> 在片的<b>上下两面交替</b>伸出——这是 β 折叠片的标志。</p>
  <p>注意黄色虚线连接的是<b>不同链</b>的 <code>C=O</code> 与 <code>N–H</code>：靠这些横向氢键，原本在序列上相距很远的链段被缝合在一起（与 α 螺旋的"链内 i→i+4"形成对比）。</p>`,
  para:`<p><b class="s">β 折叠片（平行）</b>：并排的 β 链方向<b>相同</b>（箭头同向）。因为同向，链间氢键不再垂直，而是<b>斜跨</b>相邻两残基，几何上不如反平行规整，平均也略不稳。</p>
  <p>同样是<b>链间</b>主链氢键把片缝起来，同样有<b>褶皱</b>与<b>侧链上下交替</b>。</p>
  <p>切到"反平行"对比一下两种氢键花样：反平行的虚线近乎横平，平行的虚线明显倾斜——这是区分两类折叠片最直观的特征。</p>`
};
function renderNotes(){ document.getElementById('notes').innerHTML=NOTES[mode]; }

function setMode(m){
  mode=m;
  document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const helixMode=(m==='helix');
  document.getElementById('rowLen').style.display=helixMode?'':'none';
  document.getElementById('rowCnt').style.display=helixMode?'none':'';
  // 切到折叠片时给个好的初始视角
  if(helixMode){ yaw=-0.6; pitch=0.18; } else { yaw=-0.5; pitch=-0.55; }
  rebuild();
}
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));

const sLen=document.getElementById('sLen'), vLen=document.getElementById('vLen');
sLen.addEventListener('input',e=>{len=+e.target.value; vLen.textContent=len+' 残基'; rebuild();});
const sCnt=document.getElementById('sCnt'), vCnt=document.getElementById('vCnt');
sCnt.addEventListener('input',e=>{cnt=+e.target.value; vCnt.textContent=cnt+' 条'; rebuild();});

const bind=(id,key)=>document.getElementById(id).addEventListener('change',e=>show[key]=e.target.checked);
bind('tHB','hb'); bind('tRibbon','ribbon'); bind('tCB','cb'); bind('tArrow','arrow'); bind('tLabel','label'); bind('tSpin','spin');

/* 鼠标 / 触摸 */
let drag=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{
  if(!drag)return;
  yaw+=(e.clientX-lx)*0.01; pitch+=(e.clientY-ly)*0.01;
  pitch=Math.max(-1.45,Math.min(1.45,pitch));
  lx=e.clientX; ly=e.clientY;
});
canvas.addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(14,Math.min(90,dist+e.deltaY*0.03));},{passive:false});

resize(); setMode('helix'); frame();
</script>
</body>
